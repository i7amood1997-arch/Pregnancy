<title>مسار الحمل</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kufam:wght@500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
/* Layout: mobile-first app shell. Bottom tab bar under 960px, right-side rail (inline-start) above.
   Thesis element: the 280-day ring, split into three trimester arcs with 40 week ticks. */
:root{
  /* neutrals: white page, soft cool-grey cards */
  --bg:#FFFFFF; --surface:#F4F7F8; --surface-2:#E9EEF0; --line:#E1E7E9; --line-strong:#C3CDD1;
  --ink:#0F1B1F; --ink-2:#45545A; --ink-3:#5A696E;
  /* single accent: teal */
  --accent:#0B6F68; --accent-ink:#FFFFFF; --accent-soft:#E3F1EF; --accent-hover:#095A54;
  /* trimester hues (data colors, separate from accent) */
  --t1:#3B5B9A; --t1-soft:#E2E8F6; --t2:#7A510A; --t2-soft:#F4E6C4; --t3:#A13C57; --t3-soft:#F5DCE2;
  /* semantic */
  --danger:#B42318; --danger-soft:#FBE3E0; --warn:#7E4C00; --warn-soft:#F8E8C8; --ok:#256C43;
  --scrim:rgb(12 22 26 / .45);
  --shadow:0 1px 2px rgb(15 27 31 / .05), 0 8px 24px -12px rgb(15 27 31 / .16);
  --shadow-lg:0 -10px 40px -12px rgb(15 27 31 / .28);
  --focus:#0B6F68; --fruit-bg:#FFFFFF;

  --f-display:"Kufam","Tajawal","Noto Kufi Arabic",Tahoma,sans-serif;
  --f-body:"Tajawal","Noto Sans Arabic","Segoe UI",Tahoma,sans-serif;

  /* type scale, ratio 1.2 */
  --fs-xs:.75rem; --fs-sm:.875rem; --fs-md:1rem; --fs-lg:1.1875rem; --fs-xl:1.4375rem; --fs-2xl:1.75rem; --fs-3xl:2.125rem; --fs-4xl:3rem;
  /* spacing, 4pt */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:64px;
  /* radius rule: surfaces 14, controls 10, chips full */
  --r-surface:14px; --r-control:10px; --r-pill:999px;
  /* motion */
  --ease-out:cubic-bezier(.23,1,.32,1); --ease-drawer:cubic-bezier(.32,.72,0,1); --ease-exit:cubic-bezier(.4,0,1,1);
  --tabbar-h:68px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1416; --surface:#162024; --surface-2:#1E2A2F; --line:#27353A; --line-strong:#3A4A50;
    --ink:#E8EEF0; --ink-2:#B5C3C7; --ink-3:#93A3A8;
    --accent:#5CC8BC; --accent-ink:#04201D; --accent-soft:#123A37; --accent-hover:#7AD6CB;
    --t1:#9DB4EA; --t1-soft:#1D2740; --t2:#E8BE69; --t2-soft:#372C14; --t3:#F2A3B7; --t3-soft:#3B2028;
    --danger:#F4877E; --danger-soft:#3A1A17; --warn:#EDBE63; --warn-soft:#332711; --ok:#7DD3A0;
    --scrim:rgb(0 0 0 / .6);
    --shadow:0 1px 2px rgb(0 0 0 / .3), 0 10px 28px -12px rgb(0 0 0 / .5);
    --shadow-lg:0 -10px 40px -12px rgb(0 0 0 / .6);
    --focus:#5CC8BC; --fruit-bg:#DDE5E7;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1416; --surface:#162024; --surface-2:#1E2A2F; --line:#27353A; --line-strong:#3A4A50;
    --ink:#E8EEF0; --ink-2:#B5C3C7; --ink-3:#93A3A8;
    --accent:#5CC8BC; --accent-ink:#04201D; --accent-soft:#123A37; --accent-hover:#7AD6CB;
    --t1:#9DB4EA; --t1-soft:#1D2740; --t2:#E8BE69; --t2-soft:#372C14; --t3:#F2A3B7; --t3-soft:#3B2028;
    --danger:#F4877E; --danger-soft:#3A1A17; --warn:#EDBE63; --warn-soft:#332711; --ok:#7DD3A0;
    --scrim:rgb(0 0 0 / .6);
    --shadow:0 1px 2px rgb(0 0 0 / .3), 0 10px 28px -12px rgb(0 0 0 / .5);
    --shadow-lg:0 -10px 40px -12px rgb(0 0 0 / .6);
    --focus:#5CC8BC; --fruit-bg:#DDE5E7;
    color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:var(--fs-md);line-height:1.7;font-weight:400;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.3;margin:0;text-wrap:balance}
p{margin:0}
.num,.tnum{font-variant-numeric:tabular-nums}
.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.i-sm{width:18px;height:18px}
[dir="rtl"] .flip{transform:scaleX(-1)}
:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px;border-radius:8px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;inset-inline-start:16px;top:-60px;z-index:100;background:var(--accent);color:var(--accent-ink);padding:10px 16px;border-radius:var(--r-control);text-decoration:none}
.skip:focus{top:calc(8px + env(safe-area-inset-top,0px))}

/* ---------- shell ---------- */
.shell{display:block;min-height:100%}
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:var(--s4) calc(var(--tabbar-h) + 32px + env(safe-area-inset-bottom,0px));max-width:1120px;width:100%;margin-inline:auto;outline:none}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);padding-block:var(--s2) var(--s4)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:var(--fs-lg);color:var(--ink);text-decoration:none}
.brand-mark{width:30px;height:30px;flex:none}
.today-line{font-size:var(--fs-xs);color:var(--ink-3);text-align:end;line-height:1.5}
.today-line strong{display:block;color:var(--ink-2);font-weight:500;font-size:var(--fs-sm)}

.rail{display:none}
.tabbar{position:fixed;inset-inline:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabbar ul{list-style:none;margin:0 auto;padding:6px 0;display:grid;grid-template-columns:repeat(5,1fr);max-width:560px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:54px;padding:4px 2px;border:0;background:none;color:var(--ink-3);text-decoration:none;font-size:var(--fs-xs);font-weight:500;border-radius:14px;width:100%;transition:color 160ms ease, transform 140ms var(--ease-out)}
.tab .pill{display:grid;place-items:center;width:52px;height:28px;border-radius:var(--r-pill);transition:background-color 200ms ease}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"] .pill{background:var(--accent-soft)}
.tab:active{transform:scale(.96)}

@media (min-width:960px){
  .shell{display:grid;grid-template-columns:248px minmax(0,1fr)}
  .rail{display:flex;flex-direction:column;gap:var(--s5);position:sticky;top:env(safe-area-inset-top,0px);height:100vh;height:100dvh;padding:var(--s5) var(--s4);border-inline-end:1px solid var(--line);background:var(--surface)}
  .rail ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
  .rail a{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:var(--r-control);color:var(--ink-2);text-decoration:none;font-weight:500;transition:background-color 160ms ease,color 160ms ease}
  .rail a:hover{background:var(--surface-2);color:var(--ink)}
  .rail a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
  .rail .rail-foot{margin-top:auto;font-size:var(--fs-xs);color:var(--ink-3);line-height:1.6}
  .tabbar{display:none}
  .topbar .brand{visibility:hidden}
  main{padding-block:var(--s5) var(--s7);padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
}

/* ---------- generic ---------- */
.view{display:flex;flex-direction:column;gap:var(--s6)}
.view-head{display:flex;flex-direction:column;gap:var(--s1)}
.view-head h1{font-size:var(--fs-2xl)}
.view-head p{color:var(--ink-2);max-width:62ch}
.section-title{font-size:var(--fs-lg);display:flex;align-items:center;gap:var(--s2)}
.muted{color:var(--ink-3)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-surface);padding:var(--s5)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:var(--r-control);border:1px solid transparent;font-weight:500;font-size:var(--fs-sm);text-decoration:none;white-space:nowrap;transition:background-color 160ms ease,border-color 160ms ease,transform 140ms var(--ease-out)}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{background:var(--accent-hover)}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--line-strong)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-danger{background:var(--danger);color:#fff}
:root[data-theme="dark"] .btn-danger{color:#1A0705}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn-danger{color:#1A0705}}
.btn-text{background:none;border:0;color:var(--accent);padding:0 10px;min-height:44px}
.icon-btn{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:var(--r-control);border:1px solid transparent;background:none;color:var(--ink-2);transition:background-color 160ms ease,transform 140ms var(--ease-out)}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn:active{transform:scale(.94)}
.icon-btn:disabled{opacity:.4;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:2px 12px;border-radius:var(--r-pill);font-size:var(--fs-xs);font-weight:500;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.t1{background:var(--t1-soft);color:var(--t1)}
.chip.t2{background:var(--t2-soft);color:var(--t2)}
.chip.t3{background:var(--t3-soft);color:var(--t3)}
.chip.accent{background:var(--accent-soft);color:var(--accent)}
.chip.example{background:var(--warn-soft);color:var(--warn)}
.note{display:flex;gap:var(--s3);align-items:flex-start;color:var(--ink-3);font-size:var(--fs-sm);line-height:1.8;max-width:70ch}
.note .i{margin-top:3px;color:var(--ink-3)}

/* ---------- state messages ---------- */
.state{display:flex;flex-direction:column;align-items:flex-start;gap:var(--s3);padding:var(--s6) var(--s5);border-radius:var(--r-surface);background:var(--surface);border:1px solid var(--line)}
.state .state-icon{display:grid;place-items:center;width:52px;height:52px;border-radius:16px;background:var(--warn-soft);color:var(--warn)}
.state.info .state-icon{background:var(--accent-soft);color:var(--accent)}
.state h2{font-size:var(--fs-xl)}
.state p{color:var(--ink-2);max-width:56ch}
.banner{display:flex;gap:var(--s3);align-items:flex-start;padding:var(--s4);border-radius:var(--r-control);background:var(--warn-soft);color:var(--ink)}
.banner .i{color:var(--warn);margin-top:2px}

/* ---------- home ---------- */
.hero{display:grid;gap:var(--s5);align-items:center}
.ring-box{position:relative;width:min(232px,70vw);aspect-ratio:1;max-width:100%;justify-self:center}
.ring{width:100%;height:100%;display:block;overflow:visible}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.ring-center .lbl{font-size:var(--fs-sm);color:var(--ink-3)}
.ring-center .big{font-family:var(--f-display);font-weight:700;font-size:4rem;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.ring-center .sub{font-size:var(--fs-xs);color:var(--ink-3);margin-top:6px}
.ring-mark{fill:var(--surface);stroke:var(--ink);stroke-width:3}
.hero-text{display:flex;flex-direction:column;gap:var(--s4);min-width:0}
.hero-text h1{font-size:var(--fs-3xl);font-weight:700;letter-spacing:0}
.hero-chips{display:flex;flex-wrap:wrap;gap:var(--s2)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4) var(--s5);margin:0;padding-top:var(--s4);border-top:1px solid var(--line)}
.facts div{min-width:0}
.facts dt{font-size:var(--fs-xs);color:var(--ink-3);margin-bottom:2px}
.facts dd{margin:0;font-weight:500;line-height:1.5}
.facts dd .h{display:block;font-size:var(--fs-xs);font-weight:400;color:var(--ink-3);margin-top:2px}
.facts dd .big-n{font-family:var(--f-display);font-size:var(--fs-2xl);font-weight:700;line-height:1.1}
@media (min-width:640px){
  .hero{grid-template-columns:auto minmax(0,1fr);gap:var(--s6)}
  .ring-box{width:240px}
}
@media (min-width:1100px){.ring-box{width:268px}}

.home-grid{display:grid;gap:var(--s5)}
@media (min-width:900px){.home-grid{grid-template-columns:1.25fr 1fr}}
.baby{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-surface);padding:var(--s5);display:flex;flex-direction:column;gap:var(--s4)}
.baby .lead{font-family:var(--f-display);font-size:var(--fs-xl);font-weight:600;line-height:1.4}
.baby .lead em{font-style:normal;color:var(--accent)}
.measures{display:flex;flex-wrap:wrap;gap:var(--s5)}
.measure{display:flex;align-items:center;gap:var(--s2);color:var(--ink-2);font-size:var(--fs-sm)}
.measure b{color:var(--ink);font-weight:600}
.ruler{position:relative;padding-top:var(--s2)}
.ruler-track{position:relative;height:10px;border-radius:var(--r-pill);background:var(--surface-2);overflow:hidden}
.ruler-fill{position:absolute;inset-block:0;inset-inline-start:0;border-radius:var(--r-pill);background:var(--accent);transform-origin:right center;transition:transform 900ms var(--ease-out)}
[dir="ltr"] .ruler-fill{transform-origin:left center}
.ruler-ticks{display:flex;justify-content:space-between;margin-top:6px;font-size:var(--fs-xs);color:var(--ink-3)}
.ruler-cap{font-size:var(--fs-xs);color:var(--ink-3);margin-top:var(--s1)}
.tip{display:flex;flex-direction:column;gap:var(--s3);padding:var(--s5);border-radius:var(--r-surface);background:var(--accent-soft);color:var(--ink)}
.tip .tip-h{display:flex;align-items:center;gap:var(--s2);color:var(--accent);font-weight:600;font-size:var(--fs-sm)}
.tip p{font-size:var(--fs-lg);line-height:1.7}
.tip .more{display:flex;flex-direction:column;gap:var(--s2);margin:0;padding:0;list-style:none;color:var(--ink-2);font-size:var(--fs-sm)}

.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:var(--s3);align-items:start;padding-block:var(--s3);position:relative}
.tl::before{content:"";position:absolute;inset-inline-start:13px;top:34px;bottom:-10px;width:2px;background:var(--line)}
.tl:last-child::before{display:none}
.tl .dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line-strong);color:var(--ink-3)}
.tl.done .dot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tl.now .dot{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.tl .t{font-weight:500;line-height:1.5}
.tl .d{font-size:var(--fs-sm);color:var(--ink-3)}
.tl .when{font-size:var(--fs-xs);color:var(--ink-3);white-space:nowrap;padding-top:3px}
.tl.now .when{color:var(--accent);font-weight:600}
.next-appt{display:flex;gap:var(--s4);align-items:center}
.datebox{display:flex;flex-direction:column;align-items:center;justify-content:center;width:60px;min-height:64px;border-radius:14px;background:var(--surface-2);flex:none;line-height:1.2}
.datebox b{font-family:var(--f-display);font-size:var(--fs-xl);font-variant-numeric:tabular-nums}
.datebox span{font-size:var(--fs-xs);color:var(--ink-2)}

/* ---------- weeks ---------- */
.tri-group{display:flex;flex-direction:column;gap:var(--s3)}
.tri-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:var(--s1) var(--s3)}
.tri-head h2{font-size:var(--fs-lg);display:flex;align-items:center;gap:10px}
.tri-head h2 .sw{width:12px;height:12px;border-radius:4px}
.tri-head .r{font-size:var(--fs-sm);color:var(--ink-3)}
.week-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:8px}
.wk{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:62px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-display);font-size:var(--fs-xl);font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink-2);transition:transform 140ms var(--ease-out),background-color 160ms ease,border-color 160ms ease}
.wk:active{transform:scale(.95)}
.wk .st{position:absolute;top:5px;inset-inline-end:6px;line-height:0}
.wk .st .i{width:14px;height:14px;stroke-width:2.25}
.wk.past.t1{background:var(--t1-soft);border-color:transparent;color:var(--t1)}
.wk.past.t2{background:var(--t2-soft);border-color:transparent;color:var(--t2)}
.wk.past.t3{background:var(--t3-soft);border-color:transparent;color:var(--t3)}
.wk.future.t1{box-shadow:inset 0 -3px 0 var(--t1-soft)}
.wk.future.t2{box-shadow:inset 0 -3px 0 var(--t2-soft)}
.wk.future.t3{box-shadow:inset 0 -3px 0 var(--t3-soft)}
.wk.current{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 6px 18px -8px var(--accent)}
.wk.current .now{font-family:var(--f-body);font-size:10px;font-weight:500;line-height:1;margin-top:3px}
@media (hover:hover) and (pointer:fine){.wk:hover{border-color:var(--line-strong)}.wk.current:hover{border-color:var(--accent)}}
.legend{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s4);font-size:var(--fs-sm);color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend i{width:16px;height:16px;border-radius:5px;display:inline-block;border:1px solid var(--line)}

/* ---------- months ---------- */
.month-grid{display:grid;gap:var(--s3);grid-template-columns:1fr}
@media (min-width:640px){.month-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1100px){.month-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.mcard{display:flex;flex-direction:column;gap:var(--s2);padding:var(--s4) var(--s5);border-radius:var(--r-surface);background:var(--surface);border:1px solid var(--line);min-width:0}
.mcard .top{display:flex;align-items:center;justify-content:space-between;gap:var(--s2)}
.mcard h2{font-size:var(--fs-lg)}
.mcard .wr{font-weight:500}
.mcard .dr{font-size:var(--fs-sm);color:var(--ink-2)}
.mcard .hj{font-size:var(--fs-xs);color:var(--ink-3)}
.mcard.past{background:transparent}
.mcard.past h2,.mcard.past .wr{color:var(--ink-2)}
.mcard.current{border:2px solid var(--accent);box-shadow:var(--shadow)}
.mprog{height:6px;border-radius:var(--r-pill);background:var(--surface-2);overflow:hidden;margin-top:var(--s1)}
.mprog i{display:block;height:100%;background:var(--accent);border-radius:inherit}

/* ---------- calendar ---------- */
.cal-wrap{display:grid;gap:var(--s5)}
@media (min-width:1100px){.cal-wrap{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);align-items:start}}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-surface);padding:var(--s3)}
@media (min-width:640px){.cal{padding:var(--s4)}}
.cal-head{display:flex;align-items:center;gap:var(--s1);margin-bottom:var(--s3)}
.cal-head h2{font-size:var(--fs-lg);flex:1;text-align:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cal-dow{text-align:center;font-size:var(--fs-xs);color:var(--ink-3);padding-block:4px;font-weight:500}

<script>
(function(){
'use strict';
document.documentElement.lang='ar';
document.documentElement.dir='rtl';

/* =========================================================
   1. Date core (pure). Days are integers since the Unix epoch, UTC only.
   ========================================================= */
var DAY=86400000;
function isoToDay(s){
  if(typeof s!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(s)) return null;
  var p=s.split('-').map(Number), t=Date.UTC(p[0],p[1]-1,p[2]), d=new Date(t);
  if(d.getUTCFullYear()!==p[0]||d.getUTCMonth()!==p[1]-1||d.getUTCDate()!==p[2]) return null;
  return Math.round(t/DAY);
}
function dayParts(n){var d=new Date(n*DAY);return {y:d.getUTCFullYear(),m:d.getUTCMonth(),d:d.getUTCDate(),wd:d.getUTCDay()};}
function dayToISO(n){var p=dayParts(n);return p.y+'-'+String(p.m+1).padStart(2,'0')+'-'+String(p.d).padStart(2,'0');}
function ymdToDay(y,m,d){return Math.round(Date.UTC(y,m,d)/DAY);}
function todayDay(){var n=new Date();return ymdToDay(n.getFullYear(),n.getMonth(),n.getDate());}

/* =========================================================
   2. Pregnancy math (pure)
   ========================================================= */
var TERM=280, FULL_TERM=259, MAX_DAY=293;
var MONTHS=[[1,4],[5,8],[9,13],[14,17],[18,22],[23,27],[28,31],[32,35],[36,40]];
var TRIS=[[1,13],[14,27],[28,40]];

function referenceDay(s, today){
  var e={};
  if(s.mode==='edd'){
    var edd=isoToDay(s.edd);
    if(edd==null){e.edd='أدخلي تاريخ الولادة المتوقع بصيغة صحيحة.';return {ok:false,errors:e};}
    return {ok:true,ref:edd-TERM};
  }
  if(s.mode==='us'){
    var u=isoToDay(s.usDate), w=Number(s.usW), d=Number(s.usD);
    if(u==null) e.usDate='أدخلي تاريخ السونار بصيغة صحيحة.';
    else if(today!=null && u>today) e.usDate='تاريخ السونار في المستقبل. اختاري تاريخ فحص تمّ بالفعل.';
    if(String(s.usW).trim()===''||!Number.isInteger(w)||w<0||w>42) e.usW='عدد الأسابيع من 0 إلى 42.';
    if(String(s.usD).trim()===''||!Number.isInteger(d)||d<0||d>6) e.usD='عدد الأيام من 0 إلى 6.';
    if(Object.keys(e).length) return {ok:false,errors:e};
    return {ok:true,ref:u-(w*7+d)};
  }
  var l=isoToDay(s.lmp), c=Number(s.cycle);
  if(l==null) e.lmp='أدخلي تاريخ أول يوم من آخر دورة بصيغة صحيحة.';
  else if(today!=null && l>today) e.lmp='هذا التاريخ في المستقبل. اختاري أول يوم من آخر دورة حدثت فعلًا.';
  if(String(s.cycle).trim()===''||!Number.isInteger(c)||c<21||c>40) e.cycle='طول الدورة رقم صحيح من 21 إلى 40 يومًا.';
  if(Object.keys(e).length) return {ok:false,errors:e};
  return {ok:true,ref:l+(c-28)};
}
function weekOfGA(ga){return Math.floor(ga/7)+1;}
function triOfWeek(w){return w<=13?1:(w<=27?2:3);}
function monthOfWeek(w){if(w>40)return 9;for(var i=0;i<9;i++){if(w>=MONTHS[i][0]&&w<=MONTHS[i][1])return i+1;}return 1;}
function weekRange(ref,n){return [ref+7*(n-1),ref+7*n-1];}
function monthRange(ref,i){var m=MONTHS[i-1];return [ref+7*(m[0]-1), i===9?ref+TERM:ref+7*m[1]-1];}
function triRange(ref,i){var t=TRIS[i-1];return [ref+7*(t[0]-1), i===3?ref+TERM-1:ref+7*t[1]-1];}
function summarize(ref,today){
  var ga=today-ref, st=ga<0?'before':(ga<TERM?'active':(ga<=MAX_DAY?'overdue':'beyond'));
  var week=ga>=0?weekOfGA(ga):0;
  return {ref:ref,today:today,ga:ga,status:st,w:Math.floor(ga/7),d:((ga%7)+7)%7,week:week,
    tri:week?triOfWeek(Math.min(week,40)):0, month:week?monthOfWeek(week):0,
    edd:ref+TERM, left:ref+TERM-today};
}
function milestones(ref){
  return [
    {k:'t1end',t:'نهاية الثلث الأول',d:'آخر يوم في الأسبوع 13',a:ref+90},

    {k:'t3',t:'بداية الثلث الثالث',d:'أول يوم في الأسبوع 28',a:ref+189},
    {k:'term',t:'اكتمال مدة الحمل',d:'37 أسبوعًا بالضبط',a:ref+FULL_TERM},
    {k:'edd',t:'موعد الولادة المتوقع',d:'40 أسبوعًا بالضبط',a:ref+TERM},
    {k:'w42',t:'نهاية الأسبوع 42',d:'تواصلي مع طبيبتكِ قبل هذا اليوم',a:ref+MAX_DAY}
  ];
}

/* =========================================================

var MONTH_AR=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];

var hijriFmt=null;
try{hijriFmt=new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura-nu-latn',{day:'numeric',month:'long',year:'numeric',timeZone:'UTC'});}catch(err){hijriFmt=null;}
function hijri(n){if(!hijriFmt)return '';try{return '<span class="nw">'+hijriFmt.format(new Date(n*DAY))+'</span>';}catch(err){return '';}}
function fmt(n,o){o=o||{};var p=dayParts(n);return (o.wd?DAY_AR[p.wd]+'، ':'')+p.d+' '+MONTH_AR[p.m]+(o.y===false?'':' '+p.y);}
function fmtRange(a,b){var A=dayParts(a),B=dayParts(b);return 'من '+A.d+' '+MONTH_AR[A.m]+(A.y!==B.y?' '+A.y:'')+' إلى '+B.d+' '+MONTH_AR[B.m]+' '+B.y;}
function gaText(ga){var w=Math.floor(ga/7),d=ga%7;return d===0?(w+' أسبوع بالضبط'):(w+' أسبوع و '+d+' يوم');}
function countAr(n,f,gen){ // f=[one,two,few,many,hundreds,two-genitive]
  if(n===1)return f[0]; if(n===2)return gen?f[5]:f[1];
  var r=n%100; if(r>=3&&r<=10)return n+' '+f[2]; if(r>=11)return n+' '+f[3]; return n+' '+f[4];
}
var DAYS_F=['يوم واحد','يومان','أيام','يومًا','يوم','يومين'];
function inDays(n){return n===1?'غدًا':'بعد '+countAr(n,DAYS_F,true);}
var WEEKS_F=['أسبوع واحد','أسبوعان','أسابيع','أسبوعًا','أسبوع','أسبوعين'];
function fmtTime(t){if(!t)return '';var a=t.split(':').map(Number),h=a[0],per=h<12?'صباحًا':(h<15?'ظهرًا':'مساءً');h=h%12||12;return h+':'+String(a[1]).padStart(2,'0')+' '+per;}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function ic(id,cls){return '<svg class="i'+(cls?' '+cls:'')+'" aria-hidden="true"><use href="#i-'+id+'"/></svg>';}

/* =========================================================

   [size, length, weight, development[], tips[]]

var WEEKS=[null,
[null,null,null,['يبدأ حساب الحمل من أول يوم في آخر دورة شهرية، لذلك لا يوجد جنين بعد في هذا الأسبوع.','يستعد الجسم لإطلاق بويضة جديدة.'],['إن كنتِ تخططين للحمل فاسألي طبيبتكِ عن الفيتامينات المناسبة لكِ قبل الحمل.','سجّلي تاريخ بداية الدورة بدقة، فهو أساس حساب كل التواريخ.']],

['رأس دبوس','أقل من 1 مم',null,['يحدث الإخصاب وتبدأ الخلية الأولى بالانقسام بسرعة.','تتحرك الكرة الخلوية الصغيرة نحو الرحم.'],['قد لا تشعرين بأي تغيير بعد، وهذا طبيعي تمامًا.']],
['بذرة خشخاش','نحو 1 مم',null,['تنغرس الكرة الخلوية في بطانة الرحم.','يبدأ تكوّن المشيمة وكيس الحمل.'],['قد يظهر اختبار الحمل المنزلي إيجابيًا في نهاية هذا الأسبوع.','لا تتناولي أي دواء قبل استشارة طبيبتكِ.']],

['ليمونة','نحو 7.4 سم','نحو 23 غ',['تتكوّن بصمات الأصابع.','ينتهي الثلث الأول مع نهاية هذا الأسبوع.'],['هذا وقت مناسب لمشاركة الخبر إن رغبتِ بذلك.']],
['حبة خوخ','نحو 8.7 سم','نحو 43 غ',['بداية الثلث الثاني، وتعود الطاقة عند كثير من الحوامل.','يبدأ نمو شعر ناعم يغطي الجسم.'],['ابدئي التفكير في ملابس حمل مريحة.']],
['تفاحة','نحو 10 سم','نحو 70 غ',['يستطيع الجنين الإحساس بالضوء من خلال جفونه المغلقة.','تتحرك المفاصل بحرية أكبر.'],['اعتني بصحة فمكِ وأسنانكِ، فاللثة تصبح أكثر حساسية.']],

['فلفلة حلوة','نحو 14 سم','نحو 190 غ',['تتشكّل الأذن وقد يبدأ بسماع أصوات خافتة.','قد تشعرين بأولى الحركات كرفرفة خفيفة.'],['احجزي السونار التفصيلي بين الأسبوع 18 و22.']],

function seedItems(ref){
  return [
    {id:'ex1',kind:'appt',title:'متابعة نمو الجنين',date:dayToISO(ref+7*32+1),time:'10:30',body:'سؤال الطبيبة عن وضعية الجنين وتمارين التنفس.',example:true},

  ];

function normalize(s){
  s=(s&&typeof s==='object')?s:{};
  s.settings=Object.assign({},DEFAULT_SETTINGS,(s.settings&&typeof s.settings==='object')?s.settings:{});
  if(['system','light','dark'].indexOf(s.theme)<0)s.theme='system';
  ['items','kicks','contr','weights'].forEach(function(k){if(!Array.isArray(s[k]))s[k]=[];});
  ['checks','logs','bagCustom','bagHidden','contacts'].forEach(function(k){if(!s[k]||typeof s[k]!=='object'||Array.isArray(s[k]))s[k]={};});
  if(!s.kickActive||typeof s.kickActive!=='object'||typeof s.kickActive.start!=='number')s.kickActive=null;
  if(typeof s.contrActive!=='number')s.contrActive=null;
  if(s.preWeight==null||isNaN(parseFloat(s.preWeight)))s.preWeight='';
  if(typeof s.lastBackup!=='number')s.lastBackup=null;
  if(['kicks','contr','weight','log'].indexOf(s.toolTab)<0)s.toolTab=null;
  s.items=s.items.filter(function(i){return i&&typeof i==='object'&&typeof i.title==='string'&&isoToDay(i.date)!=null;})
    .map(function(i){if(!i.id)i.id=uid();if(!Array.isArray(i.qs))i.qs=[];return i;});
  s.kicks=s.kicks.filter(function(k){return k&&typeof k.start==='number'&&typeof k.end==='number';});
  s.contr=s.contr.filter(function(k){return k&&typeof k.s==='number'&&typeof k.e==='number';});
  s.weights=s.weights.filter(function(w){return w&&isoToDay(w.date)!=null&&!isNaN(parseFloat(w.kg));});
  return s;
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

  if(raw){try{var s=JSON.parse(raw);if(s&&s.settings)return normalize(s);}catch(err){}}
  var r=referenceDay(DEFAULT_SETTINGS,null);
  return normalize({settings:Object.assign({},DEFAULT_SETTINGS),theme:'system',items:seedItems(r.ref),checks:{}});
}

/* ---------- ring ---------- */
var R=104,C=2*Math.PI*R,SEG=[[0,91],[91,189],[189,280]],GAP=2.5;
function ringSVG(c){
  var segs='',prog='',ticks='';
  SEG.forEach(function(s,i){
    var a=s[0]/TERM*C+GAP/2,len=(s[1]-s[0])/TERM*C-GAP;
    segs+='<circle cx="120" cy="120" r="'+R+'" fill="none" stroke="var(--surface-2)" stroke-width="14" stroke-dasharray="'+len.toFixed(2)+' '+C.toFixed(2)+'" stroke-dashoffset="'+(-a).toFixed(2)+'"/>';
    prog+='<circle class="rp" data-i="'+i+'" cx="120" cy="120" r="'+R+'" fill="none" stroke="var(--accent)" stroke-width="14" stroke-linecap="butt" stroke-dasharray="0 '+C.toFixed(2)+'" stroke-dashoffset="'+(-a).toFixed(2)+'"/>';
  });
  for(var w=1;w<40;w++){
    var ang=w*7/TERM*2*Math.PI, r1=R-13, r2=R-(w%4===0?20:17);
    ticks+='<line x1="'+(120+r1*Math.cos(ang)).toFixed(2)+'" y1="'+(120+r1*Math.sin(ang)).toFixed(2)+'" x2="'+(120+r2*Math.cos(ang)).toFixed(2)+'" y2="'+(120+r2*Math.sin(ang)).toFixed(2)+'" stroke="var(--line-strong)" stroke-width="'+(w%4===0?1.6:1)+'" stroke-linecap="round"/>';
  }
  var label='تقدّم الحمل: '+Math.min(c.ga,TERM)+' يومًا من 280 يومًا';
  return '<svg class="ring" viewBox="0 0 240 240" role="img" aria-label="'+label+'"><g transform="translate(240 0) scale(-1 1)"><g transform="rotate(-90 120 120)">'+segs+prog+ticks+
    '<circle id="ringMark" class="ring-mark" cx="'+(120+R)+'" cy="120" r="8"/></g></g></svg>';
}
function setRing(v){
  var arcs=document.querySelectorAll('.rp');
  arcs.forEach(function(el){
    var i=+el.getAttribute('data-i'),s=SEG[i],f=Math.max(0,Math.min(v,s[1])-s[0]);
    var len=f>0?Math.max(0,f/TERM*C-(v>=s[1]?GAP:GAP/2)):0;
    el.setAttribute('stroke-dasharray',len.toFixed(2)+' '+C.toFixed(2));
  });
  var m=document.getElementById('ringMark');
  if(m){var ang=Math.min(v,TERM)/TERM*2*Math.PI;m.setAttribute('cx',(120+R*Math.cos(ang)).toFixed(2));m.setAttribute('cy',(120+R*Math.sin(ang)).toFixed(2));}
}
var reduceMotion=false;
try{reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(err){}
function animateRing(target,animate){
  target=Math.max(0,Math.min(target,TERM));
  if(!animate||reduceMotion){setRing(target);return;}
  var t0=null,dur=1100;
  function step(ts){if(t0==null)t0=ts;var p=Math.min(1,(ts-t0)/dur),e=1-Math.pow(1-p,4);setRing(target*e);if(p<1)requestAnimationFrame(step);}
  setRing(0);requestAnimationFrame(step);
}

function dayEvents(c,day){
  var ev=[];
  if(c.ok){
    milestones(c.ref).forEach(function(m){
      if(m.a===day)ev.push({type:'ms',t:m.b!=null?('بداية '+m.t):m.t});
      if(m.b!=null&&m.b===day)ev.push({type:'ms',t:'آخر يوم في '+m.t});
    });
  }
  state.items.forEach(function(it){if(isoToDay(it.date)===day)ev.push({type:it.kind==='appt'?'ap':'nt',t:it.title,it:it});});
  return ev;
}

  var head=subN()+'<div class="view-head"><h1>التقويم</h1></div>';

  if(calSel==null)calSel=c.today;
  var first=ymdToDay(calView.y,calView.m,1), off=(dayParts(first).wd+1)%7, start=first-off;
  var grid='';
  DOW.forEach(function(d){grid+='<div class="cal-dow" aria-hidden="true"><abbr title="'+d[1]+'" style="text-decoration:none">'+d[0]+'</abbr></div>';});
  for(var k=0;k<42;k++){
    var day=start+k, p=dayParts(day), ga=day-c.ref, cls='cd', inner='', lbl=fmt(day,{wd:true});
    if(p.m!==calView.m)cls+=' out';
    var csty='';if(ga>=0&&ga<TERM){var tw=weekOfGA(ga);cls+=' pw';csty=' style="--cf:'+palFor(tw).field+'"';}
    if(day===c.ref+TERM)cls+=' edd';
    if(day===c.today)cls+=' today';
    if(day===calSel)cls+=' sel';
    inner='<span class="dn">'+p.d+'</span>';
    if(ga>=0&&ga<=MAX_DAY&&ga%7===0){inner+='<span class="wkn">'+weekOfGA(ga)+'</span>';lbl+='، بداية الأسبوع '+weekOfGA(ga);}
    var ev=dayEvents(c,day), mk='';
    if(ev.some(function(e){return e.type==='ms';})){mk+='<span class="mk ms"></span>';}
    if(ev.some(function(e){return e.type==='ap';})){mk+='<span class="mk ap"></span>';}
    if(ev.some(function(e){return e.type==='nt';})){mk+='<span class="mk"></span>';}
    if(ev.length)lbl+='، '+ev.map(function(e){return e.t;}).join('، ');

function dayDetailHTML(c,day){

    h+='<div class="hero-chips"><span class="chip accent tnum">'+gaText(ga)+'</span><span class="chip">الأسبوع '+w+'</span>'+(w<=40?'<span class="chip t'+triOfWeek(w)+'">'+TRI_AR[triOfWeek(w)-1]+'</span>':'')+'</div>';

    }).join('')+'</ul>';

function readPrefsForm(){

  return {mode:m?m.value:'lmp',lmp:f('pLmp'),cycle:f('pCycle')===''?'':Number(f('pCycle')),edd:f('pEdd'),usDate:f('pUs'),usW:f('pUsW')===''?'':Number(f('pUsW')),usD:f('pUsD')===''?'':Number(f('pUsD'))};

var ERR_MAP={lmp:'ePLmp',cycle:'ePCycle',edd:'ePEdd',usDate:'ePUs',usW:'ePUsW',usD:'ePUsD'};
var INPUT_MAP={lmp:'pLmp',cycle:'pCycle',edd:'pEdd',usDate:'pUs',usW:'pUsW',usD:'pUsD'};
function updatePreview(showErrors){
  var s=readPrefsForm(), today=todayDay(), r=referenceDay(s,today), pv=document.getElementById('pPreview');
  if(!pv)return r;
  Object.keys(ERR_MAP).forEach(function(k){var e=document.getElementById(ERR_MAP[k]),inp=document.getElementById(INPUT_MAP[k]);
    var msg=(!r.ok&&r.errors[k]&&showErrors)?r.errors[k]:'';
    if(e)e.innerHTML=msg?ic('alert','i-sm')+'<span>'+msg+'</span>':'';
    if(inp){if(msg)inp.setAttribute('aria-invalid','true');else inp.removeAttribute('aria-invalid');}});
  if(!r.ok){pv.className='preview bad';pv.innerHTML='<span class="k">النتيجة</span><span class="v">أكملي البيانات بشكل صحيح لعرض موعد الولادة المتوقع.</span>';return r;}
  var sm=summarize(r.ref,today);
  if(sm.status==='before'){pv.className='preview bad';pv.innerHTML='<span class="k">النتيجة</span><span class="v">وفق هذه البيانات لم يبدأ الحمل بعد. راجعي التاريخ.</span>';return r;}
  pv.className='preview';
  pv.innerHTML='<span class="k">موعد الولادة المتوقع بهذه البيانات</span><span class="v tnum">'+fmt(sm.edd,{wd:true})+'، '+hijri(sm.edd)+'</span><span class="k tnum">عمر الحمل اليوم: '+gaText(sm.ga)+(sm.status==='beyond'?'، أي بعد نهاية الأسبوع 42':'')+'</span>';
  return r;
}

function hasUserData(){return state.items.some(function(i){return !i.example;})||Object.keys(state.logs).length>0||state.weights.length>0||state.kicks.length>0||state.contr.length>0;}
function nextAppt(today){return state.items.filter(function(it){return it.kind==='appt'&&isoToDay(it.date)>=today;}).sort(function(a,b){return (a.date+(a.time||'')).localeCompare(b.date+(b.time||''));})[0];}
function focusIn(sel){var el=document.querySelector(sel);if(el)el.focus({preventScroll:true});}
function focusId(id){var el=document.getElementById(id);if(el)el.focus({preventScroll:true});}
function vibrate(){try{if(navigator.vibrate)navigator.vibrate(12);}catch(err){}}

/* ---------- home: this week ---------- */
function msTimelineHTML(c){
  return '<ol class="timeline">'+milestones(c.ref).map(function(m){
    var end=m.b!=null?m.b:m.a, stt=c.today>end?'done':(c.today>=m.a?'now':'up');
    var when=stt==='done'?'تمّ':(stt==='now'?(m.b!=null?'الآن':'اليوم'):inDays(m.a-c.today));
    var dates=m.b!=null?fmtRange(m.a,m.b):fmt(m.a,{wd:true});
    return '<li class="tl '+stt+'"><span class="dot">'+(stt==='done'?ic('check','i-sm'):ic('flag','i-sm'))+'</span><div><p class="t">'+m.t+'</p><p class="d tnum">'+dates+'</p></div><span class="when">'+when+'</span></li>';
  }).join('')+'</ol>';
}
function weekNowHTML(c){
  var li=[];
  var nx=nextAppt(c.today);
  if(nx){var nd=isoToDay(nx.date);li.push('<li>'+ic('clock')+'<span class="tx">'+esc(nx.title)+(nx.example?' <span class="chip example">مثال</span>':'')+'<small class="tnum">'+fmt(nd,{wd:true,y:false})+(nx.time?'، '+fmtTime(nx.time):'')+'، '+(nd===c.today?'اليوم':inDays(nd-c.today))+'</small></span></li>');}
  else li.push('<li>'+ic('clock')+'<span class="tx">لا يوجد موعد قادم</span><a class="btn btn-text" href="#notes" data-action="go-add">إضافة</a></li>');
  var due=CHECKUPS.filter(function(x){var a=weekRange(c.ref,x.a)[0],b=weekRange(c.ref,x.b)[1];return c.today>=a&&c.today<=b&&!state.checks[x.id];})[0];
  if(due){var db=weekRange(c.ref,due.b)[1];li.push('<li>'+ic('steth')+'<span class="tx">'+due.t+'<small class="tnum">موعده الآن، حتى '+fmt(db,{wd:true,y:false})+'</small></span></li>');}
  var nm=milestones(c.ref).filter(function(m){return (m.b!=null?m.b:m.a)>=c.today;})[0];
  if(nm&&li.length<3){var now=c.today>=nm.a;li.push('<li>'+ic('flag')+'<span class="tx">'+nm.t+'<small class="tnum">'+(now?(nm.b!=null?'الآن، حتى '+fmt(nm.b,{wd:true,y:false}):'اليوم'):fmt(nm.a,{wd:true,y:false})+'، '+inDays(nm.a-c.today))+'</small></span></li>');}
  return '<section class="week-now" aria-labelledby="wnT"><h2 id="wnT" class="section-title">القادم</h2><ul class="todo">'+li.join('')+'</ul></section>';
}

/* ---------- tools ---------- */
var TOOLS=[
  {id:'kicks',t:'حركة الجنين',i:'heart',from:28,d:'عدّ الركلات',later:'من الأسبوع 28'},
  {id:'contr',t:'مؤقت الطلق',i:'timer',from:36,d:'قياس الانقباضات',later:'للأسابيع الأخيرة'},
  {id:'weight',t:'الوزن',i:'weight',from:0,d:'متابعة التغيّر'},
  {id:'log',t:'سجل اليوم',i:'mood',from:0,d:'الأعراض والمزاج'}
];
function toolById(id){for(var i=0;i<TOOLS.length;i++)if(TOOLS[i].id===id)return TOOLS[i];return TOOLS[3];}
function curWeek(c){return c.ok&&c.status!=='before'?c.week:0;}
function toolTab(c){var w=curWeek(c);return state.toolTab||(w>=36?'contr':(w>=28?'kicks':'log'));}
function renderTools(c){
  var w=curWeek(c),tab=toolTab(c);
  var pick='<div class="tool-tabs" role="group" aria-label="اختاري الأداة">'+TOOLS.map(function(t){
    return '<button class="tt" data-action="tool-tab" data-tool="'+t.id+'" aria-pressed="'+(t.id===tab)+'">'+ic(t.i)+'<span>'+t.t+'</span></button>';}).join('')+'</div>';
  var body=tab==='kicks'?kicksHTML(w):(tab==='contr'?contrHTML(w):(tab==='weight'?weightHTML(c):logHTML()));
  return '<div class="view view-tools"><div class="view-head"><h1>الأدوات</h1></div>'+pick+
    '<section class="tool" aria-label="'+toolById(tab).t+'">'+body+'</section></div>';
}
function startTick(){
  clearInterval(tick);tick=null;
  if(cur!=='tools'||!(state.kickActive||state.contrActive))return;
  tick=setInterval(function(){
    var a=document.getElementById('kickTimer');if(a&&state.kickActive)a.textContent=mmss(Date.now()-state.kickActive.start);
    var b=document.getElementById('contrTimer');if(b&&state.contrActive)b.textContent=mmss(Date.now()-state.contrActive);
  },1000);
}

/* contractions */
function contrHTML(w){
  var a=state.contrActive,now=Date.now(),h='',list=state.contr.slice().sort(function(x,y){return x.s-y.s;});
  if(w&&w<36)h+=noteBox('يفيد المؤقت عادةً في الأسابيع الأخيرة. الانقباضات المنتظمة قبل الأسبوع 37 تستدعي التواصل مع الطبيبة فورًا.','alert');
  h+='<button class="big-tap'+(a?' on':'')+'" id="contrBtn" data-action="contr-toggle">'+(a?'<b id="contrTimer">'+mmss(now-a)+'</b><span>اضغطي عند انتهاء الانقباضة</span>':ic('timer')+'<span>بدأت الانقباضة</span>')+'</button>';
  if(!list.length&&!a){h+='<p class="tool-hint">اضغطي عند بداية كل انقباضة ثم عند انتهائها، وسيُحسب الفاصل والمدة تلقائيًا.</p>';}
  var hr=list.filter(function(x){return x.s>=now-3600000;});
  var avgD=hr.length?hr.reduce(function(t,x){return t+(x.e-x.s);},0)/hr.length:0, ints=[];
  for(var i=1;i<hr.length;i++)ints.push(hr[i].s-hr[i-1].s);
  var avgI=ints.length?ints.reduce(function(t,x){return t+x;},0)/ints.length:0;
  if(list.length)h+='<div class="stat-row"><div class="stat"><b>'+hr.length+'</b><span>خلال آخر ساعة</span></div><div class="stat"><b>'+mmss(avgD)+'</b><span>متوسط المدة</span></div><div class="stat"><b>'+(ints.length?mmss(avgI):'0:00')+'</b><span>متوسط الفاصل</span></div></div>';
  var span=hr.length>1?hr[hr.length-1].s-hr[0].s:0;
  if(hr.length>=6&&span>=45*60000&&avgI<=5.5*60000&&avgD>=45000)h+='<div class="banner" role="alert">'+ic('alert')+'<span>انقباضاتكِ منتظمة ومتقاربة منذ ساعة تقريبًا. تواصلي مع طبيبتكِ أو توجهي إلى المستشفى حسب تعليماتها.</span></div>';
  h+='<details class="fold"><summary>متى أتوجه إلى المستشفى؟</summary>'+liList(['اتبعي تعليمات طبيبتكِ أولًا، فهي تعرف حالتكِ.','قاعدة شائعة: انقباضات كل 5 دقائق أو أقل، تستمر كل منها نحو دقيقة، وبانتظام لمدة ساعة.','توجهي فورًا إذا نزل الماء، أو حدث نزيف، أو قلّت حركة الجنين.','اضغطي الزر عند بداية الانقباضة، ثم مرة أخرى عند انتهائها.'])+'</details>';
  var rev=list.slice().reverse().slice(0,8);
  h+='<section><div class="sub-head"><h2>السجل</h2>'+(list.length?'<button class="btn btn-text" data-action="contr-clear">'+ic('trash','i-sm')+'مسح السجل</button>':'')+'</div>'+(rev.length?'<ul class="hist">'+rev.map(function(x){
    var idx=list.indexOf(x),prev=idx>0?list[idx-1]:null;
    return '<li><span class="grow"><b class="tnum">'+clock(x.s)+'</b><br><span class="muted tnum">المدة '+mmss(x.e-x.s)+(prev?'، الفاصل '+mmss(x.s-prev.s):'، أول انقباضة')+'</span></span><button class="icon-btn" data-action="contr-del" data-id="'+x.id+'" aria-label="حذف الانقباضة">'+ic('trash')+'</button></li>';}).join('')+'</ul>'
    :'<p class="muted" style="font-size:var(--fs-sm)">لا توجد انقباضات مسجّلة.</p>')+'</section>';
  return h;
}

/* weight */
function kgTxt(v){return (Math.round(v*10)/10).toString()+' كغ';}
function diffTxt(v){var r=Math.round(v*10)/10;return '<bdi dir="ltr">'+(r>0?'+':'')+r+'</bdi> كغ';}
function weightHTML(c){
  var ws=state.weights.slice().sort(function(x,y){return x.date.localeCompare(y.date);});
  var last=ws[ws.length-1], pre=state.preWeight!==''?parseFloat(state.preWeight):null;
  var h='<form class="panel form" id="weightForm" novalidate><div class="inline-form"><div class="field"><label class="sr" for="wKg">الوزن بالكيلوغرام</label><input class="input" id="wKg" type="number" inputmode="decimal" step="0.1" min="30" max="250" placeholder="وزن اليوم بالكيلوغرام" aria-describedby="eW"></div><button class="btn btn-primary" type="submit" style="min-height:48px">'+ic('check','i-sm')+'حفظ</button></div>'+
    '<p class="err" id="eW" aria-live="polite"></p>'+
    '<details class="fold"><summary>تسجيل بتاريخ آخر</summary><div class="field"><label for="wDate">التاريخ</label><input class="input" type="date" id="wDate" value="'+todayISO()+'" style="max-width:240px" aria-describedby="wDateEcho"><p class="help tnum" id="wDateEcho"></p></div></details></form>';
  if(last){
    var base=pre!=null?pre:parseFloat(ws[0].kg), baseLbl=pre!=null?'منذ ما قبل الحمل':'منذ أول تسجيل';
    h+='<div class="stat-row two"><div class="stat"><b>'+kgTxt(parseFloat(last.kg))+'</b><span>آخر وزن، '+fmt(isoToDay(last.date),{y:false})+'</span></div><div class="stat"><b>'+diffTxt(parseFloat(last.kg)-base)+'</b><span>'+baseLbl+'</span></div></div>';
  }
  h+='<figure class="chart-wrap" id="wChart"></figure>';
  h+='<details class="fold"'+(pre==null&&ws.length?'':'')+'><summary>وزنكِ قبل الحمل'+(pre!=null?' ('+kgTxt(pre)+')':'')+'</summary><div class="field"><label for="wPre">الوزن قبل الحمل بالكيلوغرام</label><input class="input" id="wPre" type="number" inputmode="decimal" step="0.1" min="30" max="250" value="'+(pre!=null?pre:'')+'" style="max-width:220px" aria-describedby="hPre"><p class="help" id="hPre">يظهر خطًا مرجعيًا في الرسم. زيادة الوزن المناسبة تختلف حسب الوزن قبل الحمل، فاسألي طبيبتكِ عن المعدل المناسب لكِ.</p></div></details>';
  var rev=ws.slice().reverse().slice(0,6);
  h+='<section><div class="sub-head"><h2>آخر القراءات</h2><span class="c tnum">'+ws.length+'</span></div>'+(rev.length?'<ul class="hist">'+rev.map(function(x,i){
    var d=isoToDay(x.date),ga=c.ok?d-c.ref:null,prev=rev[i+1];
    return '<li><span class="grow"><b class="tnum">'+kgTxt(parseFloat(x.kg))+'</b>'+(prev?' <span class="muted">('+diffTxt(parseFloat(x.kg)-parseFloat(prev.kg))+')</span>':'')+'<br><span class="muted tnum">'+fmt(d,{wd:true})+(ga!=null&&ga>=0&&ga<=MAX_DAY?'، الأسبوع '+weekOfGA(ga):'')+'</span></span><button class="icon-btn" data-action="weight-del" data-date="'+x.date+'" aria-label="حذف قراءة '+fmt(d)+'">'+ic('trash')+'</button></li>';}).join('')+'</ul>'
    :'<p class="muted" style="font-size:var(--fs-sm)">سجّلي وزنكِ مرة في الأسبوع، في نفس الوقت تقريبًا.</p>')+'</section>';
  return h;
}
function drawWeightChart(){
  var box=document.getElementById('wChart'); if(!box)return;
  var c=ctx(); if(!c.ok){box.innerHTML='';return;}
  var pts=state.weights.map(function(w){var d=isoToDay(w.date);return {d:d,x:(d-c.ref)/7,y:parseFloat(w.kg),date:w.date};})
    .filter(function(p){return p.d-c.ref>=0&&p.d-c.ref<=MAX_DAY;}).sort(function(a,b){return a.x-b.x;});
  if(!pts.length){box.innerHTML='';return;}
  var pre=state.preWeight!==''?parseFloat(state.preWeight):null;
  var W=Math.max(280,Math.round(box.clientWidth||320)),H=220,ml=10,mr=44,mt=18,mb=30,pw=W-ml-mr,ph=H-mt-mb;
  var ys=pts.map(function(p){return p.y;}); if(pre!=null)ys.push(pre);
  var lo=Math.min.apply(null,ys)-1,hi=Math.max.apply(null,ys)+1,span=hi-lo,step=span<=6?1:(span<=12?2:(span<=30?5:10));
  lo=Math.floor(lo/step)*step;hi=Math.ceil(hi/step)*step;if(hi<=lo)hi=lo+step;
  var xmax=Math.max(40,Math.ceil(pts[pts.length-1].x));
  function X(x){return ml+pw-(x/xmax)*pw;}
  function Y(y){return mt+ph-(y-lo)/(hi-lo)*ph;}
  var g='',t='font-size="12" fill="var(--ink-3)" font-family="inherit"';
  for(var v=lo;v<=hi+1e-9;v+=step){g+='<line x1="'+ml+'" x2="'+(ml+pw)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(ml+pw+8)+'" y="'+(Y(v)+4).toFixed(1)+'" '+t+'>'+v+'</text>';}
  [0,10,20,30,40].forEach(function(wk){if(wk<=xmax)g+='<text x="'+X(wk).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" '+t+'>'+wk+'</text>';});
  if(pre!=null)g+='<line x1="'+ml+'" x2="'+(ml+pw)+'" y1="'+Y(pre).toFixed(1)+'" y2="'+Y(pre).toFixed(1)+'" stroke="var(--ink-3)" stroke-width="1.5" stroke-dasharray="5 5"/><text x="'+(ml+4)+'" y="'+(Y(pre)-6).toFixed(1)+'" '+t+'>قبل الحمل</text>';
  var line=pts.map(function(p,i){return (i?'L':'M')+X(p.x).toFixed(1)+' '+Y(p.y).toFixed(1);}).join(' ');
  var area=line+' L'+X(pts[pts.length-1].x).toFixed(1)+' '+(mt+ph)+' L'+X(pts[0].x).toFixed(1)+' '+(mt+ph)+' Z';
  g+='<path d="'+area+'" fill="var(--accent)" fill-opacity=".08"/>';
  if(pts.length>1)g+='<path d="'+line+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  pts.forEach(function(p,i){var lastP=i===pts.length-1,lbl='الأسبوع '+(Math.floor(p.x)+1)+'، '+kgTxt(p.y)+'، '+fmt(p.d);
    g+='<circle class="hit" data-i="'+i+'" cx="'+X(p.x).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="14" fill="transparent" tabindex="0" role="img" aria-label="'+lbl+'"/>'+
      '<circle class="pt" cx="'+X(p.x).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="'+(lastP?6:4)+'" fill="var(--accent)" stroke="var(--bg)" stroke-width="2" pointer-events="none"/>';});
  var lp=pts[pts.length-1];
  box.innerHTML='<svg direction="ltr" style="direction:ltr" viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="group" aria-label="رسم بياني لتغيّر الوزن خلال الحمل، آخر قراءة '+kgTxt(lp.y)+'">'+g+'</svg><div class="chart-tip" id="wTip" hidden></div><figcaption class="help">المحور الأفقي أسبوع الحمل، والعمودي الوزن بالكيلوغرام.</figcaption>';
  var tip=document.getElementById('wTip');
  function show(el){var p=pts[+el.getAttribute('data-i')];tip.textContent='الأسبوع '+(Math.floor(p.x)+1)+'، '+kgTxt(p.y);tip.hidden=false;
    var x=Math.min(W-60,Math.max(60,X(p.x)));tip.style.left=x+'px';tip.style.top=Y(p.y)+'px';}
  function hide(){tip.hidden=true;}
  box.querySelectorAll('.hit').forEach(function(el){el.addEventListener('pointerenter',function(){show(el);});el.addEventListener('focus',function(){show(el);});el.addEventListener('pointerleave',hide);el.addEventListener('blur',hide);el.addEventListener('click',function(){show(el);});});
}
var rsT=null;
window.addEventListener('resize',function(){clearTimeout(rsT);rsT=setTimeout(function(){if(cur==='tools'&&document.getElementById('wChart'))drawWeightChart();},150);});

/* daily log */
var MOODS=[['great','ممتاز'],['good','جيد'],['ok','عادي'],['tired','متعبة'],['hard','صعب']];
var SYMS=[['nausea','غثيان'],['vomit','قيء'],['fatigue','تعب'],['headache','صداع'],['heartburn','حموضة'],['constipation','إمساك'],['back','ألم الظهر'],['swelling','تورّم'],['insomnia','أرق'],['cramps','تقلصات خفيفة'],['dizzy','دوخة'],['moodswing','تقلّب المزاج'],['appetite','شهية زائدة'],['breath','ضيق نفس خفيف']];
function lbl(arr,k){for(var i=0;i<arr.length;i++)if(arr[i][0]===k)return arr[i][1];return '';}
function curLogDate(){return (logDate&&isoToDay(logDate)!=null)?logDate:todayISO();}
function setLog(d,patch){var e=Object.assign({},state.logs[d]||{},patch);if(!e.mood&&!(e.sym&&e.sym.length)&&!e.note)delete state.logs[d];else state.logs[d]=e;save();}
function logHistHTML(){
  var ds=Object.keys(state.logs).sort().reverse().slice(0,7);
  if(!ds.length)return '<p class="muted" style="font-size:var(--fs-sm)">يُحفظ ما تختارينه تلقائيًا ويظهر هنا.</p>';
  return '<ul class="hist">'+ds.map(function(d){var e=state.logs[d],day=isoToDay(d);
    return '<li><span class="grow"><b class="tnum">'+fmt(day,{wd:true,y:false})+'</b>'+(e.mood?' <span class="chip accent">'+lbl(MOODS,e.mood)+'</span>':'')+'<br><span class="muted">'+((e.sym||[]).map(function(k){return lbl(SYMS,k);}).join('، ')||'بلا أعراض مسجّلة')+(e.note?'، '+esc(e.note.slice(0,60))+(e.note.length>60?'…':''):'')+'</span></span>'+
      (d!==curLogDate()?'<button class="btn btn-text" data-action="log-open" data-date="'+d+'">فتح</button>':'')+'</li>';}).join('')+'</ul>';
}

function parseQs(f,old){
  var lines=((f.qs&&f.qs.value)||'').split('\n').map(function(x){return x.trim();}).filter(Boolean);
  old=old||[];
  return lines.map(function(t){return {t:t,done:old.some(function(o){return o.t===t&&o.done;})};});
}
function qsHTML(it){
  if(it.kind!=='appt'||!it.qs||!it.qs.length)return '';
  var done=it.qs.filter(function(q){return q.done;}).length;
  return '<details class="qs fold" id="qs-'+esc(it.id)+'"'+(qsOpen===it.id?' open':'')+'><summary class="tnum">أسئلة للطبيبة ('+done+' من '+it.qs.length+')</summary><div>'+it.qs.map(function(q,i){
    return '<label class="check sm"><input type="checkbox" id="q-'+esc(it.id)+'-'+i+'" data-q="'+esc(it.id)+'|'+i+'"'+(q.done?' checked':'')+'><span class="box">'+ic('check')+'</span><span class="lt"><span>'+esc(q.t)+'</span></span></label>';}).join('')+'</div></details>';
}
function icsEsc(x){return String(x).replace(/\\/g,'\\\\').replace(/;/g,'\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');}
function evTimes(it){
  var d=it.date.replace(/-/g,'');
  if(!it.time){var nd=dayToISO(isoToDay(it.date)+1).replace(/-/g,'');return {allDay:true,s:d,e:nd};}
  var p=it.date.split('-').map(Number),t=it.time.split(':').map(Number),e=new Date(Date.UTC(p[0],p[1]-1,p[2],t[0],t[1])+3600000);
  return {allDay:false,s:d+'T'+pad2(t[0])+pad2(t[1])+'00',e:e.getUTCFullYear()+pad2(e.getUTCMonth()+1)+pad2(e.getUTCDate())+'T'+pad2(e.getUTCHours())+pad2(e.getUTCMinutes())+'00'};
}
function evDesc(it){var x=it.body||'';if(it.qs&&it.qs.length)x+=(x?'\n\n':'')+'أسئلة للطبيبة:\n'+it.qs.map(function(q){return '- '+q.t;}).join('\n');return x;}
function icsHref(it){
  var tm=evTimes(it),stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  var L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Masar Alhaml//AR','CALSCALE:GREGORIAN','METHOD:PUBLISH','BEGIN:VEVENT','UID:'+it.id+'@masar-alhaml','DTSTAMP:'+stamp];
  if(tm.allDay)L.push('DTSTART;VALUE=DATE:'+tm.s,'DTEND;VALUE=DATE:'+tm.e);else L.push('DTSTART:'+tm.s,'DTEND:'+tm.e);
  L.push('SUMMARY:'+icsEsc(it.title));var ds=evDesc(it);if(ds)L.push('DESCRIPTION:'+icsEsc(ds));
  L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(it.title),'TRIGGER:'+(tm.allDay?'-PT15H':'-P1D'),'END:VALARM');
  if(!tm.allDay)L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(it.title),'TRIGGER:-PT2H','END:VALARM');
  L.push('END:VEVENT','END:VCALENDAR');
  return 'data:text/calendar;charset=utf-8,'+encodeURIComponent(L.join('\r\n'));
}
function gcalHref(it){var tm=evTimes(it);return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(it.title)+'&dates='+tm.s+'/'+tm.e+'&details='+encodeURIComponent(evDesc(it));}

var PAL_KEYS=['--field','--deep','--bg','--surface','--surface-2','--line','--line-strong','--ink','--ink-2','--ink-3','--accent','--accent-ink','--accent-soft','--accent-hover','--focus'];
function hexMix(a,b,t){var A=[1,3,5].map(function(i){return parseInt(a.substr(i,2),16);}),B=[1,3,5].map(function(i){return parseInt(b.substr(i,2),16);});
  return '#'+A.map(function(x,i){return ('0'+Math.round(x*(1-t)+B[i]*t).toString(16)).slice(-2);}).join('');}
function isDark(){if(state.theme==='dark')return true;if(state.theme==='light')return false;try{return window.matchMedia('(prefers-color-scheme: dark)').matches;}catch(err){return false;}}
function palFor(w,dark){w=Math.max(3,Math.min(40,w||3));var p=PAL[w];if(dark==null)dark=isDark();
  return dark?{field:p[5],deep:p[6],bg:p[7],tint:p[8],line:p[9]}:{field:p[0],deep:p[1],bg:p[2],tint:p[3],line:p[4]};}
function applyVars(el,o){var v={'--field':o.field,'--deep':o.deep,'--bg':o.bg,'--surface':o.tint,'--surface-2':o.line,'--line':o.line,'--line-strong':hexMix(o.deep,o.bg,.66),
  '--ink':o.deep,'--ink-2':hexMix(o.deep,o.bg,.12),'--ink-3':hexMix(o.deep,o.bg,.22),'--accent':o.deep,'--accent-ink':o.bg,'--accent-soft':o.tint,'--accent-hover':hexMix(o.deep,o.bg,.12),'--focus':o.deep};
  Object.keys(v).forEach(function(k){el.style.setProperty(k,v[k]);});}
function applyPalette(c){
  var root=document.documentElement, w=(c&&c.ok&&c.status!=='before')?Math.min(c.week,40):null, field=null;
  if(w==null)PAL_KEYS.forEach(function(k){root.style.removeProperty(k);});
  else{var o=palFor(w);applyVars(root,o);field=o.field;}
  document.querySelectorAll('meta[name="theme-color"]').forEach(function(m){if(field)m.setAttribute('content',field);});
}

function openLayerEl(el){

function closeLayer(noFocus){

function openWeek(n){fillWeek(n,0);openLayerEl(ws);}
function stepWeek(d,animate){var n=sheetWeek+d;if(n<1||n>40)return;fillWeek(n,animate?d:0);}

// swipe between weeks (RTL: finger moves right reveals the next week) and drag-down to close on the handle
(function(){
  var b=document.getElementById('wsBody'),sx=0,sy=0,st=0,active=false;
  b.addEventListener('pointerdown',function(e){if(e.pointerType==='mouse')return;active=true;sx=e.clientX;sy=e.clientY;st=Date.now();});
  b.addEventListener('pointerup',function(e){
    if(!active)return;active=false;var dx=e.clientX-sx,dy=e.clientY-sy,dt=Date.now()-st;
    if(Math.abs(dx)>Math.abs(dy)*1.4&&(Math.abs(dx)>56||Math.abs(dx)/dt>.45)){stepWeek(dx>0?1:-1,true);}
  });
  b.addEventListener('pointercancel',function(){active=false;});
  function attachDrag(sh,g){
    var gy=0,gt=0,drag=false;
    g.addEventListener('pointerdown',function(e){drag=true;gy=e.clientY;gt=Date.now();sh.classList.add('dragging');g.setPointerCapture(e.pointerId);});
    g.addEventListener('pointermove',function(e){if(!drag)return;var dy=e.clientY-gy;sh.style.transform='translateY('+(dy>0?dy:dy*.2)+'px)';});
    function end(e){if(!drag)return;drag=false;sh.classList.remove('dragging');var dy=e.clientY-gy,v=dy/Math.max(1,Date.now()-gt);
      if(dy>110||v>.5)closeLayer();else sh.style.transform='';}
    g.addEventListener('pointerup',end);g.addEventListener('pointercancel',end);
  }
  attachDrag(ws,document.getElementById('wsGrab'));
  attachDrag(ms,document.getElementById('msGrab'));
})();

    case 'cal-next':calView.m++;if(calView.m>11){calView.m=0;calView.y++;}render(false);break;
    case 'cal-today':{var td=todayDay(),tp=dayParts(td);calView={y:tp.y,m:tp.m};calSel=td;render(false);focusCalSel();break;}
    case 'cal-day':{var d=+a.getAttribute('data-day'),p=dayParts(d);calSel=d;if(p.m!==calView.m||p.y!==calView.y){calView={y:p.y,m:p.m};}render(false);focusCalSel();
      if(e.detail>0&&window.innerWidth<1100){var dd=document.getElementById('dayDetail');if(dd){var rt=dd.getBoundingClientRect().top;if(rt>window.innerHeight-140)window.scrollBy({top:rt-window.innerHeight*0.45,behavior:reduceMotion?'auto':'smooth'});}}
      break;}
    case 'add-on-day':openForm({kind:'appt',title:'',date:dayToISO(+a.getAttribute('data-day')),time:'',body:''});break;
    case 'go-add':e.preventDefault();openForm(null);break;
    case 'add-item':
      if(formOpen&&!editing){formOpen=false;render(false);document.getElementById('addBtn').focus();}
      else openForm(null);break;
    case 'cancel-form':formOpen=false;editing=null;formPrefill=null;render(false);var ab=document.getElementById('addBtn');if(ab)ab.focus();break;
    case 'edit-item':openForm(null,a.getAttribute('data-id'));break;
    case 'delete-item':{
      var id=a.getAttribute('data-id'),idx=state.items.findIndex(function(i){return i.id===id;});
      if(idx<0)break;
      lastDeleted={item:state.items[idx],idx:idx};state.items.splice(idx,1);
      if(editing===id){editing=null;formOpen=false;}
      save();render(false);
      var ab2=document.getElementById('addBtn');if(ab2)ab2.focus();
      toast('حُذف «'+lastDeleted.item.title+'»','تراجع',function(){if(!lastDeleted)return;state.items.splice(Math.min(lastDeleted.idx,state.items.length),0,lastDeleted.item);lastDeleted=null;save();render(false);toast('تمت استعادة العنصر');});
      break;}
    case 'cycle-dec':case 'cycle-inc':{
      var inp=document.getElementById('pCycle'),v=parseInt(inp.value,10);if(isNaN(v))v=28;
      v=Math.max(21,Math.min(40,v+(act==='cycle-inc'?1:-1)));inp.value=v;updatePreview(true);break;}
    case 'reset-open':confirmDlg('مسح كل البيانات؟','سيُحذف تاريخ الحمل والمواعيد والملاحظات وسجلات الأدوات وحالة القوائم والأرقام المحفوظة من هذا الجهاز، وتعود الإعدادات الافتراضية. لا يمكن التراجع عن هذه الخطوة.','مسح البيانات',true,resetAll);break;
    case 'reset-cancel':dlgFn=null;closeLayer();break;
    case 'dlg-ok':{var fn=dlgFn;dlgFn=null;closeLayer(true);if(fn)fn();break;}
    default:featureAction(act,a,e);
  }
});
scrim.addEventListener('click',closeLayer);
function fillMore(){markNav(cur);}
function focusCalSel(){var el=document.querySelector('.cd.sel');if(el)el.focus({preventScroll:true});}

document.addEventListener('submit',function(e){
  var f=e.target; e.preventDefault();
  if(f.id==='itemForm'){
    var kind=(f.querySelector('input[name="kind"]:checked')||{}).value||'appt';
    var title=f.title.value.trim(), date=f.date.value, time=f.time.value, body=f.body.value.trim(), ok=true, first=null;
    var eT=document.getElementById('eTitle'),eD=document.getElementById('eDate');
    eT.innerHTML='';eD.innerHTML='';f.title.removeAttribute('aria-invalid');f.date.removeAttribute('aria-invalid');
    if(!title){ok=false;eT.innerHTML=ic('alert','i-sm')+'<span>اكتبي عنوانًا قصيرًا للتعرّف عليه لاحقًا.</span>';f.title.setAttribute('aria-invalid','true');first=first||f.title;}
    if(isoToDay(date)==null){ok=false;eD.innerHTML=ic('alert','i-sm')+'<span>اختاري تاريخًا صحيحًا.</span>';f.date.setAttribute('aria-invalid','true');first=first||f.date;}
    if(!ok){first.focus();return;}
    if(editing){var it=state.items.find(function(i){return i.id===editing;});if(it){it.kind=kind;it.title=title;it.date=date;it.time=time;it.body=body;it.qs=kind==='appt'?parseQs(f,it.qs):[];delete it.example;}}
    else state.items.push({id:uid(),kind:kind,title:title,date:date,time:time,body:body,qs:kind==='appt'?parseQs(f,[]):[]});
    var wasEdit=!!editing; editing=null;formOpen=false;formPrefill=null;save();render(false);
    var ab=document.getElementById('addBtn');if(ab)ab.focus();
    toast(wasEdit?'تم حفظ التعديلات':(kind==='appt'?'تمت إضافة الموعد':'تمت إضافة الملاحظة'));
  }
  if(featureSubmit(f))return;
  if(f.id==='prefsForm'){
    var r=updatePreview(true);
    if(!r.ok){var k=Object.keys(r.errors)[0],el=document.getElementById(INPUT_MAP[k]);if(el)el.focus();return;}
    var ns=readPrefsForm();
    state.settings=Object.assign({},state.settings,ns);
    if(state.items.some(function(i){return i.example;}))state.items=state.items.filter(function(i){return !i.example;}).concat(seedItems(r.ref));
    calView=null;calSel=null;save();
    toast('تم حفظ بيانات الحمل');
    firstRender=true; render(false); firstRender=false;
  }
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.closest&&t.closest('#prefsForm'))updatePreview(false);
  if(t.id&&document.getElementById(t.id+'Echo'))echoDate(t.id);
  if(t.id==='logNote'){clearTimeout(noteTimer);var nv=t.value;noteTimer=setTimeout(function(){setLog(curLogDate(),{note:nv.trim()});updateLogHist();},400);}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.closest&&t.closest('#prefsForm')&&t.name!=='mode'){updatePreview(true);}
  if(featureChange(t))return;
  if(t.matches('[data-check]')){state.checks[t.getAttribute('data-check')]=t.checked;save();
    var keep=t.id;render(false);var el=document.getElementById(keep);if(el)el.focus({preventScroll:true});return;}
  if(t.name==='theme'){state.theme=t.value;applyTheme(t.value);save();applyPalette(ctx());toast(t.value==='system'?'المظهر يتبع إعداد الجهاز':(t.value==='dark'?'تم تفعيل المظهر الداكن':'تم تفعيل المظهر الفاتح'));return;}
  if(t.name==='mode'){document.querySelectorAll('#prefsForm [data-mode]').forEach(function(d){d.hidden=d.getAttribute('data-mode')!==t.value;});
    if(t.value==='edd'&&!document.getElementById('pEdd').value){var rr=referenceDay(state.settings,null);if(rr.ok)document.getElementById('pEdd').value=dayToISO(rr.ref+TERM);}
    updatePreview(false);echoAll();}
});

document.addEventListener('keydown',function(e){
  if(openLayer){
    if(e.key==='Escape'){e.preventDefault();closeLayer();return;}
    if(e.key==='Tab'){
      var f=[].slice.call(openLayer.querySelectorAll('button:not([disabled]),a[href],input,[tabindex]:not([tabindex="-1"])')).filter(function(x){return x.offsetParent!==null||x===document.activeElement;});
      if(!f.length)return;var a=f[0],z=f[f.length-1];
      if(e.shiftKey&&(document.activeElement===a||document.activeElement===openLayer)){e.preventDefault();z.focus();}
      else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus();}
      return;
    }
    if(openLayer===ws&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){
      if(e.key==='ArrowLeft'){e.preventDefault();stepWeek(1,false);}
      else if(e.key==='ArrowRight'){e.preventDefault();stepWeek(-1,false);}
      else if(e.key==='Home'){e.preventDefault();fillWeek(1,0);}
      else if(e.key==='End'){e.preventDefault();fillWeek(40,0);}
    }
    return;
  }
  var el=document.activeElement;
  if(el&&el.classList&&el.classList.contains('cd')){
    var dmap={ArrowLeft:1,ArrowRight:-1,ArrowDown:7,ArrowUp:-7};
    if(dmap[e.key]!=null){e.preventDefault();var nd=+el.getAttribute('data-day')+dmap[e.key],p=dayParts(nd);calSel=nd;
      if(p.m!==calView.m||p.y!==calView.y)calView={y:p.y,m:p.m};render(false);focusCalSel();}
  }
  if(el&&el.classList&&el.classList.contains('wk')){
    var list=[].slice.call(document.querySelectorAll('.wk')),i=list.indexOf(el),cols=Math.round(el.parentElement.offsetWidth/(el.offsetWidth+8))||5;
    var m={ArrowLeft:1,ArrowRight:-1,ArrowDown:cols,ArrowUp:-cols}[e.key];
    if(m!=null){var nx=list[i+m];if(nx){e.preventDefault();nx.focus();}}
  }
});

window.addEventListener('hashchange',route);
// keep "today" honest if the tab stays open past midnight
document.addEventListener('visibilitychange',function(){
  if(document.hidden||openLayer||todayDay()===lastDay)return;
  if((cur==='notes'&&formOpen)||cur==='prefs'){var c=ctx();document.getElementById('todayLine').innerHTML='<strong class="tnum">'+fmt(c.today,{wd:true})+'</strong>'+hijri(c.today);lastDay=c.today;return;}
  render(false);
});

buildNav();
route();
})();
